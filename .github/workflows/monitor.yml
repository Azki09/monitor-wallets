name: Monitor de wallets

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: "normal = revisar movimientos · test = enviar correo de prueba"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - test

permissions:
  contents: write

concurrency:
  group: monitor-wallets
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar movimientos
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MODE: ${{ github.event.inputs.modo || 'normal' }}
        run: python monitor.py

      - name: Guardar estado e historial en el repo
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json history.csv
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Monitor: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
